<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curso Nivel 1 - Telecomunicaciones</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: #f4f6f8; 
            text-align: center; 
            padding: 50px; 
            margin: 0;
        }
        h1 { 
            color: #b30000; 
            margin-bottom: 10px;
        }
        h2 {
            color: #333;
            margin-top: 0;
        }
        .tarjeta { 
            background: white; 
            padding: 40px; 
            border-radius: 10px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
            max-width: 600px; 
            margin: auto; 
        }
        .boton { 
            background: #b30000; 
            color: white; 
            padding: 12px 25px; 
            text-decoration: none; 
            border-radius: 5px; 
            display: inline-block; 
            margin-top: 20px; 
            font-weight: bold; 
            transition: background 0.3s;
        }
        .boton:hover { 
            background: #8a0000; 
        }
    </style>
</head>
<body>
    <div class="tarjeta">
        <h1>🚑 Cruz Roja Colombiana</h1>
        <h2>Curso Nivel 1 de Telecomunicaciones</h2>
        <p>Seccional Bolívar</p>
        <p>¡Felicidades! Tu página web en GitHub Pages está funcionando correctamente. 🎉</p>
        <a href="#" class="boton">Comenzar Curso</a>
    </div>

</html>
